<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
</head>
<body>
    <h1 th:text="'Registro de Productos - ' + ${estudiante}">Registro</h1>
    
    <form action="#" th:action="@{/productos/guardar}" th:object="${productoForm}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required/><br><br>

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required/><br><br>

        <label>Categoría:</label>
        <input type="text" th:field="*{categoria}" required/><br><br>

        <button type="submit">Guardar Producto</button>
    </form>
    <br>
    <a href="/productos">Regresar al catálogo</a>
</body>
</html>
